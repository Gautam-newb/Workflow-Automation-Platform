name: Deploy Workflow Automation Platform

on:
  push:
    branches:
      - feat/workflow-automation
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    if: github.event_name == 'push' && secrets.AWS_ACCESS_KEY_ID != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_OUTPUT_BUCKET: ${{ secrets.S3_OUTPUT_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install python deps & test
        run: |
          python -m pip install --upgrade pip
          pip install -r workflow_lambda/requirements.txt
          pip install pytest
          pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy with Serverless
        env:
          S3_OUTPUT_BUCKET: ${{ secrets.S3_OUTPUT_BUCKET }}
        run: |
          serverless deploy --stage prod


name: CI / CD — Workflow Automation Platform

on:
  push:
    branches:
      - feat/workflow-automation
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime deps
        run: pip install -r workflow_lambda/requirements.txt
      - name: Install test deps
        run: pip install pytest
      - name: Run pytest
        run: pytest

  deploy:
    name: Serverless Deploy
    needs: test
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Deploy disabled until AWS credentials are configured"